<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>第三方宿主站点（IIFE）</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #chat-host { width: 900px; height: 640px; }
  </style>
</head>
<body>
  <h1>第三方站点</h1>
  <div id="chat-host"></div>
  <!-- 普通 script 标签跨域加载 UIKit：宿主页不需要改造成 module script。 -->
  <script src="__SERVER_ORIGIN__/uikit/yimsg-uikit.iife.js"></script>
  <script>
    window.__yimsgErrors = [];
    window.__yimsgGlobalReady = typeof window.YimsgUIKit === 'object'
      && typeof window.YimsgUIKit.mount === 'function';
    if (window.__yimsgGlobalReady) {
      window.__yimsgHandle = window.YimsgUIKit.mount('#chat-host', {
        serverUrl: '__SERVER_ORIGIN__',
        theme: 'light',
        locale: 'zh-CN',
        layout: 'desktop',
        onError: function (error, context) {
          window.__yimsgErrors.push(context + ': ' + error.message);
        },
      });
    }
  </script>
</body>
</html>
